<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1677ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="租房管家">
<meta name="description" content="租房管家·云端查看器：上传/下载/查看最新租房数据。">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>租房管家 · 云端查看</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <span class="header-title">租房管家</span>
    <span class="header-hint" id="last-update"></span>
  </div>
</header>

<div class="action-bar">
  <button type="button" class="btn" data-act="upload">📤 上传 Excel</button>
  <button type="button" class="btn ghost" data-act="download">📥 下载 Excel</button>
</div>
<input type="file" id="excel-file" accept=".xlsx,.xls" style="display:none">

<nav class="tabs">
  <button type="button" class="tab active" data-tab="home">首页</button>
  <button type="button" class="tab" data-tab="houses">房源</button>
  <button type="button" class="tab" data-tab="payments">收款记录</button>
</nav>

<main id="content" class="viewer-main"></main>

<div id="toast" class="toast" style="display:none"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/lib/xlsx.full.min.js"></script>
<script src="js/viewer.js"></script>
</body>
</html>
